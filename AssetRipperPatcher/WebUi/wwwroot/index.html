<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetRipperPatcher</title>
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/views.css" />
</head>
<body>
    <div class="app" id="app" data-view="welcome">

        <header class="titlebar">
            <div class="titlebar__brand">
                <div class="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7h16M4 12h10M4 17h7" stroke-linecap="round" />
                    </svg>
                </div>
                <span class="titlebar__name">AssetRipperPatcher</span>
                <span class="titlebar__env" id="env-badge" hidden></span>
            </div>
            <fluent-progress-bar class="titlebar__progress" id="global-progress" value="0" visible="false"></fluent-progress-bar>
            <div class="titlebar__spacer"></div>
            <button class="lang-switch" id="lang-switch" title="Language / 语言">中文</button>
            <div class="titlebar__status" id="status-line"></div>
        </header>

        <nav class="sidebar">
            <div class="rail">
                            <button class="rail__item rail__item--import" data-nav="welcome">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                                                                <path d="M12 3v12m0 0 4-4m-4 4-4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <span data-i18n="nav.import"></span>
                            </button>
                            <button class="rail__item is-active" data-nav="browse">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                        <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" />
                        <rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
                    </svg>
                    <span data-i18n="nav.browse"></span>
                </button>
                <button class="rail__item" data-nav="tree">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M4 6h6M4 12h9M4 18h13" stroke-linecap="round" />
                    </svg>
                    <span data-i18n="nav.tree"></span>
                </button>
                <button class="rail__item" data-nav="export">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                                        <path d="M12 15V3m0 0L8 7m4-4 4 4M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span data-i18n="nav.export"></span>
                </button>
                <button class="rail__item" data-nav="settings">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="3.2" />
                        <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.5-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0A1.7 1.7 0 0 0 16.9 6l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <span data-i18n="nav.settings"></span>
                </button>
                <button class="rail__item" data-nav="log">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                        <path d="M5 7h14M5 12h14M5 17h9" stroke-linecap="round" />
                    </svg>
                    <span data-i18n="nav.log"></span>
                </button>
                <div class="rail__spacer"></div>
                                <button class="rail__item rail__item--ghost" id="btn-reset" title="Reset">
                                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                                        <path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5" stroke-linecap="round" stroke-linejoin="round" />
                                    </svg>
                                    <span data-i18n="nav.reset"></span>
                                </button>
                                <button class="rail__item rail__item--ghost" id="btn-about">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
                        <circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" stroke-linecap="round" />
                    </svg>
                    <span data-i18n="nav.about"></span>
                </button>
            </div>

            <aside class="panel" id="side-panel">
                <div class="panel__header">
                    <h2 id="side-title"></h2>
                </div>
                <div class="panel__body" id="side-body"></div>
            </aside>
        </nav>

        <main class="main" id="main">
            <section class="view" data-view="welcome" id="view-welcome">
                <div class="welcome">
                    <div class="welcome__glow"></div>
                    <h1><span data-i18n="welcome.title1"></span><br /><span class="accent" data-i18n="welcome.title2"></span></h1>
                    <p class="welcome__lead" data-i18n="welcome.lead"></p>
                    <div class="welcome__actions">
                        <fluent-button appearance="accent" size="large" id="btn-load-folder">
                            <svg slot="start" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 7h6l2 2h10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" stroke-linejoin="round" />
                            </svg>
                            <span data-i18n="welcome.pickFolder"></span>
                        </fluent-button>
                        <fluent-button appearance="outline" size="large" id="btn-load-file" data-i18n="welcome.pickFile"></fluent-button>
                    </div>
                    <div class="welcome__drop" id="drop-zone">
                        <span data-i18n="welcome.drop"></span>
                    </div>
                    <dl class="welcome__facts" id="welcome-facts"></dl>
                </div>
            </section>

            <section class="view" data-view="browse" id="view-browse">
                <div class="toolbar">
                    <fluent-text-input class="toolbar__search" id="search" data-i18n-placeholder="browse.search"></fluent-text-input>
                    <fluent-button appearance="subtle" id="btn-refresh" data-i18n="common.refresh"></fluent-button>
                    <div class="toolbar__spacer"></div>
                    <span class="toolbar__count" id="asset-count">—</span>
                </div>
                <div class="split">
                    <div class="table-wrap">
                        <table class="grid" id="asset-table">
                            <thead>
                                <tr>
                                    <th data-sort="name" class="col-name" data-i18n="browse.col.name"></th>
                                    <th data-sort="class" class="col-class" data-i18n="browse.col.class"></th>
                                    <th data-sort="collection" class="col-coll" data-i18n="browse.col.collection"></th>
                                    <th class="col-size" data-i18n="browse.col.size"></th>
                                    <th class="col-dim" data-i18n="browse.col.dimensions"></th>
                                </tr>
                            </thead>
                            <tbody id="asset-rows"></tbody>
                        </table>
                        <div class="empty" id="asset-empty" hidden>
                            <p data-i18n="browse.empty"></p>
                            <fluent-button appearance="accent" id="btn-load-from-empty" data-i18n="browse.selectFromEmpty"></fluent-button>
                        </div>
                    </div>
                    <button class="split__gutter" id="detail-gutter" type="button" aria-label="resize" title="拖动调整宽度"></button>
                                        <aside class="detail" id="detail">
                                            <div class="detail__placeholder" data-i18n="browse.detailPlaceholder"></div>
                                        </aside>
                                    </div>
            </section>

            <section class="view" data-view="tree" id="view-tree">
                <div class="tree-view">
                    <div id="tree-root" class="tree"></div>
                </div>
            </section>

            <section class="view" data-view="export" id="view-export">
                <div class="card">
                    <h1 data-i18n="export.title"></h1>
                    <p class="muted" data-i18n="export.lead"></p>
                    <div class="field-row">
                        <fluent-text-input class="field" id="export-path" data-i18n-placeholder="export.pathPlaceholder"></fluent-text-input>
                        <fluent-button appearance="outline" id="btn-pick-output" data-i18n="export.pickDir"></fluent-button>
                    </div>
                    <label class="check-row">
                        <fluent-checkbox id="export-subfolder"></fluent-checkbox>
                        <span class="check-row__text" data-i18n="export.subfolder"></span>
                    </label>
                    <div class="row">
                        <fluent-button appearance="accent" id="btn-export" data-i18n="export.start"></fluent-button>
                        <fluent-button appearance="subtle" id="btn-open-output" disabled data-i18n="export.openOutput"></fluent-button>
                    </div>
                    <div class="progress-block" id="export-progress" hidden>
                        <div class="progress-block__row">
                            <span id="progress-message" data-i18n="export.preparing"></span>
                            <span id="progress-percent">0%</span>
                        </div>
                        <fluent-progress-bar id="progress-bar" value="0"></fluent-progress-bar>
                    </div>
                </div>
            </section>

            <section class="view" data-view="settings" id="view-settings">
                <div class="settings" id="settings-root"></div>
            </section>

            <section class="view" data-view="log" id="view-log">
                <div class="log">
                    <div class="log__toolbar">
                        <fluent-text-input id="log-filter" data-i18n-placeholder="log.filter"></fluent-text-input>
                        <label class="check-row">
                            <fluent-checkbox id="log-autoscroll" checked></fluent-checkbox>
                            <span class="check-row__text" data-i18n="log.autoscroll"></span>
                        </label>
                        <div class="toolbar__spacer"></div>
                        <fluent-button appearance="subtle" id="btn-clear-log" data-i18n="log.clear"></fluent-button>
                    </div>
                    <div class="log__list" id="log-list"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="toast-host" id="toast-host"></div>

    <script type="module" src="lib/fluent.js"></script>
    <script type="module" src="js/i18n.js"></script>
    <script type="module" src="js/api.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
